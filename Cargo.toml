[package]
name = "cloud-seed"
version = "0.2.0"
authors = ["Jasper Hugo <jasper@jasperhugo.com>"]
edition = "2021"
description = "Fetch user-data from a cloud provider and write files described within to the filesystem"
repository = "https://github.com/jbg/cloud-seed"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip"]}
async-trait = { version = "0.1", default-features = false }
aws-config = { optional = true, version = "1", default-features = false, features = ["rt-tokio"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
flate2 = { optional = true, version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hostname = { version = "0.4", default-features = false, features = ["set"] }
http-body-util = { optional = true, version = "0.1", default-features = false }
hyper = { optional = true, version = "1", default-features = false }
hyper-util = { optional = true, version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
nix = { version = "0.31", default-features = false, features = ["fs", "user"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
serde_yaml = { version = "0.9", default-features = false }
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "env-filter", "fmt", "ansi", "registry", "smallvec", "tracing-log"] }

[features]
default = [
  "source-alibaba",
  "source-amazon",
  "source-exoscale",
  "source-google",
  "source-openstack",
  "source-oracle",
  "source-vultr",
]
helper-http = ["dep:flate2", "dep:http-body-util", "dep:hyper", "dep:hyper-util"]
source-alibaba = ["helper-http"]
source-amazon = ["dep:aws-config"]
source-exoscale = ["helper-http"]
source-google = ["helper-http"]
source-openstack = ["helper-http"]
source-oracle = ["helper-http"]
source-vultr = ["helper-http"]
